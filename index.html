<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JIKSONG — From Dirt to Door</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FCF8EF; --band:#F5F0E6; --surface:#FFFFFF; --ink:#2E1508; --muted:#6E5A4B; --line:#EDE3D0;
  --field:#FFFDF8; --green:#0B4A2E; --on-green:#FFFFFF; --amber:#F2A71B; --amber-ink:#2E1508;
  --soft:#F4F3F0; --footer:#33170A; --footer-ink:#F3E9DC; --footer-muted:#B79F88; --disabled:#93AB9C; --danger:#B3261E;
  --display:'Bricolage Grotesque','Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1A120C; --band:#20170F; --surface:#261A11; --ink:#F5EBDD; --muted:#C2AE95; --line:#3C2B1D;
    --field:#1F150E; --green:#2E8A5B; --on-green:#FFFFFF; --soft:#2E2117; --footer:#110904; --footer-ink:#F3E9DC; --footer-muted:#A48C75; --disabled:#4E6A5A; --danger:#F2867E;
  }
}
:root[data-theme="dark"]{
  --bg:#1A120C; --band:#20170F; --surface:#261A11; --ink:#F5EBDD; --muted:#C2AE95; --line:#3C2B1D;
  --field:#1F150E; --green:#2E8A5B; --on-green:#FFFFFF; --soft:#2E2117; --footer:#110904; --footer-ink:#F3E9DC; --footer-muted:#A48C75; --disabled:#4E6A5A; --danger:#F2867E;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{min-height:100%;display:flex;flex-direction:column}
#app{flex:1 0 auto}
.site-foot{flex-shrink:0}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
img,svg{max-width:100%}
a{color:inherit}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px;border-radius:8px}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px}
.narrow{max-width:1000px}

/* Header */
.site-head{position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:1px solid var(--line)}
.site-head .wrap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:84px}
.logo{font-family:var(--display);font-weight:800;font-size:27px;letter-spacing:-.045em;color:var(--green);text-decoration:none;justify-self:start}
.nav-links{display:flex;gap:34px;align-items:center}
.nav-links a,.nav-links button{background:none;border:0;padding:6px 0;font:500 16px var(--body);color:var(--ink);text-decoration:none;cursor:pointer;position:relative}
.nav-links a.active{color:var(--green)}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--amber);color:var(--amber-ink);font-size:11px;font-weight:700;margin-left:6px;vertical-align:2px}
.head-cta{justify-self:end;display:flex;gap:10px;align-items:center}
.menu-btn{display:none;background:none;border:2px solid var(--line);border-radius:999px;padding:9px 14px;font-weight:600;color:var(--ink);cursor:pointer}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;font:600 16px var(--body);padding:14px 26px;cursor:pointer;text-decoration:none;line-height:1.2;transition:transform .12s ease, filter .12s ease}
.btn:active{transform:scale(.98)}
.btn-green{background:var(--green);color:var(--on-green)}
.btn-green:hover{filter:brightness(1.12)}
.btn-amber{background:var(--amber);color:var(--amber-ink)}
.btn-amber:hover{filter:brightness(1.05)}
.btn-outline{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.btn-outline:hover{background:var(--ink);color:var(--bg)}
.btn-sm{font-size:12px;padding:7px 13px;font-weight:700}
.btn-ghost{background:none;border:0;color:var(--green);font-weight:700;cursor:pointer;padding:6px 0;font-size:14px;letter-spacing:.08em;text-transform:uppercase}
.btn[disabled]{background:var(--disabled);color:#fff;cursor:not-allowed}
.wide{width:100%}
.link{background:none;border:0;padding:0;color:var(--green);font-weight:700;cursor:pointer;font-size:inherit;text-decoration:none}
.link:hover{text-decoration:underline}

/* Type */
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--green);margin:0 0 10px}
.page-title{font-family:var(--display);font-weight:800;font-size:clamp(40px,5.2vw,66px);line-height:1.04;letter-spacing:-.035em;margin:0 0 14px}
.lede{font-size:clamp(17px,1.6vw,20px);color:var(--muted);margin:0;max-width:62ch}
h2,h3{font-family:var(--display);letter-spacing:-.02em;margin:0}
.label{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);margin:0 0 8px;display:block}
.muted{color:var(--muted)}

/* Fields */
.field{width:100%;border:2px solid var(--line);background:var(--field);border-radius:999px;padding:15px 20px;font:16px var(--body);color:var(--ink);outline:none;transition:border-color .15s}
.field:focus{border-color:var(--green)}
.field::placeholder{color:#9C8E80}
select.field{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 22px) 50%,calc(100% - 16px) 50%;background-size:6px 6px;background-repeat:no-repeat}
textarea.field{border-radius:22px;resize:vertical;min-height:90px}
.fgroup{margin-bottom:20px}
.err{color:var(--danger);font-size:14px;margin:6px 0 0 6px;min-height:0}
.form-err{background:color-mix(in srgb,var(--danger) 10%,transparent);color:var(--danger);border-radius:16px;padding:12px 16px;font-size:14px;margin-bottom:18px}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:30px}
.pad{padding:34px}

/* Hero */
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:48px;align-items:center;padding-top:64px;padding-bottom:88px}
.live{display:inline-flex;align-items:center;gap:8px;background:color-mix(in srgb,var(--green) 12%,transparent);color:var(--green);font-size:12.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;border-radius:999px;padding:6px 14px}
.live i{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.display{font-family:var(--display);font-weight:800;font-size:clamp(46px,6.2vw,84px);line-height:1.02;letter-spacing:-.045em;margin:26px 0 26px}
.display .g{color:var(--green)}
.hero-form{display:flex;gap:12px;margin:34px 0 26px;max-width:600px}
.hero-form .field{flex:1;min-width:0;padding:18px 22px}
.hero-form .btn{padding:18px 30px;font-size:17px;white-space:nowrap}
.facts{display:flex;flex-wrap:wrap;gap:10px 26px;padding:0;margin:0;list-style:none;font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.facts li::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:8px;vertical-align:2px}
.facts li:nth-child(2)::before{background:var(--amber)}
.tiles{position:relative;display:flex;justify-content:center;align-items:center;gap:14px;min-height:340px}
.tile{width:31%;aspect-ratio:3/4;border-radius:22px;box-shadow:0 18px 40px -18px rgba(70,40,10,.45);display:grid;place-items:center;overflow:hidden}
.tile svg{width:112%;height:auto}
.tile:nth-child(1){background:#F6E6C6;transform:rotate(-4deg) translateY(16px)}
.tile:nth-child(2){background:#F8DDAE;transform:translateY(-22px)}
.tile:nth-child(3){background:#F2C898;transform:rotate(4deg) translateY(22px)}

.band{background:var(--band);padding:88px 0}
.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:40px}
.section-head h2{font-size:clamp(30px,3.2vw,40px);font-weight:800}
.u-link{color:var(--ink);font-weight:700;text-decoration:none;border-bottom:2px solid var(--amber);padding-bottom:2px;white-space:nowrap}

.stats{background:var(--green);color:#fff;padding:78px 0}
.stats .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:48px}
.stats .num{font-family:var(--display);font-weight:800;font-size:clamp(48px,5vw,68px);line-height:1;letter-spacing:-.03em}
.stats .cap{font-size:14px;letter-spacing:.2em;text-transform:uppercase;margin:12px 0 18px;opacity:.9}
.stats p{margin:0;opacity:.88;max-width:40ch}

/* Farm cards */
.farm-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.farm{overflow:hidden;display:flex;flex-direction:column}
.farm-img{position:relative;aspect-ratio:4/3;background:#cfd9b8}
.farm-img svg{width:100%;height:100%;display:block}
.tag{position:absolute;top:16px;font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border-radius:999px;padding:5px 11px}
.tag-yield{left:16px;background:var(--green);color:#fff}
.tag-dist{right:16px;background:#FCF8EF;color:#2E1508;text-transform:none;letter-spacing:0;font-size:13px}
.tag-mine{left:16px;top:48px;background:var(--amber);color:#2E1508}
.farm-body{padding:30px 30px 34px;display:flex;flex-direction:column;flex:1}
.farm-body h3{font-size:25px;font-weight:700}
.loc{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:4px 0 18px}
.desc{margin:0 0 24px;color:var(--ink)}
.prods{list-style:none;padding:0;margin:0 0 6px}
.prods li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.prods li:last-child{border-bottom:0}
.prods strong{display:block;font-weight:500;font-size:15.5px}
.prods span{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.more{background:none;border:0;color:var(--muted);font-size:14px;padding:8px 0;cursor:pointer;text-align:left}
.more:hover{color:var(--ink)}
.farm-body .btn-outline{margin-top:auto}
.farm-body .spacer{height:22px}
.hcard .farm-body{padding:32px}
.hcard .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px}
.hcard .yl{font-size:12.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--green);white-space:nowrap}
.plist{list-style:none;padding:0;margin:0 0 30px}
.plist li{display:flex;justify-content:space-between;color:var(--muted);padding:3px 0}
.plist b{color:var(--ink)}

/* Filter */
.filter{padding:18px 20px 14px;margin:44px 0 40px;border-radius:34px}
.filter form{display:flex;gap:12px}
.filter .field{flex:1;min-width:0;padding:13px 18px}
.slider-row{display:flex;align-items:center;gap:16px;margin-top:14px;font-size:12.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.slider-row input{flex:1;accent-color:var(--green);height:6px}
.slider-row .r{white-space:nowrap}
.empty{text-align:center;padding:64px 28px}
.empty h3{font-size:30px;font-weight:700;margin-bottom:8px}
.empty p{color:var(--muted);margin:0 0 28px}

/* Pages */
.page{padding:72px 0 100px}
.page-head{margin-bottom:52px}

/* Cart */
.cart-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:44px;align-items:start}
.cart-box{min-height:420px}
.group{padding:28px 34px;border-bottom:1px solid var(--line)}
.group:last-child{border-bottom:0}
.group-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;gap:10px}
.group-head h3{font-size:21px;font-weight:700}
.group-head span{font-size:13px;color:var(--muted)}
.line{display:grid;grid-template-columns:1fr auto auto auto;align-items:center;gap:18px;padding:12px 0}
.line .nm{font-weight:500}
.line .nm small{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.qty{display:inline-flex;align-items:center;border:2px solid var(--line);border-radius:999px}
.qty button{background:none;border:0;width:34px;height:34px;font-size:18px;cursor:pointer;color:var(--ink);border-radius:999px}
.qty span{min-width:26px;text-align:center;font-weight:600}
.line .tot{font-weight:700;min-width:70px;text-align:right}
.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:20px;line-height:1;padding:4px}
.x:hover{color:var(--danger)}
.summary h3{font-size:25px;font-weight:700;margin-bottom:22px}
.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0}
.row b{font-weight:700}
.row.total{border-top:1px solid var(--line);margin-top:10px;padding-top:18px;font-size:21px;font-weight:700;font-family:var(--display)}
.ship-to{font-size:14px;color:var(--muted);margin:18px 0 0}
.ledger{background:var(--green);color:#fff;border-radius:30px;padding:34px;margin-top:26px}
.ledger .eyebrow{color:#fff;opacity:.8;font-size:12px;margin-bottom:18px}
.ledger .row{padding:9px 0;font-size:17px}

/* Orders */
.order{padding:30px 34px;margin-bottom:24px}
.order-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.order-top h3{font-size:22px;font-weight:700}
.status{display:inline-block;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:color-mix(in srgb,var(--green) 13%,transparent);color:var(--green)}
.status.cancel{background:color-mix(in srgb,var(--danger) 12%,transparent);color:var(--danger)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 22px;padding:0;list-style:none}
.steps li{font-size:12.5px;font-weight:600;color:var(--muted)}
.steps li::before{content:"";display:block;height:6px;border-radius:999px;background:var(--line);margin-bottom:8px}
.steps li.on{color:var(--ink)}
.steps li.on::before{background:var(--green)}
.o-items{list-style:none;padding:0;margin:0 0 20px;columns:2;column-gap:40px}
.o-items li{display:flex;justify-content:space-between;gap:12px;padding:5px 0;break-inside:avoid;color:var(--muted)}
.o-items b{color:var(--ink);font-weight:600}
.order-foot{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;border-top:1px solid var(--line);padding-top:18px}
.order-foot .acts{display:flex;gap:10px}

/* Profile */
.p-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:52px}
.p-head .page-title{margin-bottom:6px}
.p-actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--footer);border-radius:999px;padding:5px;box-shadow:0 10px 24px -12px rgba(50,20,5,.5)}
.seg button{border:0;background:none;color:#D8C6B2;font:700 14px var(--body);padding:11px 22px;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--green);color:#fff}
.p-grid{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.p-grid .card h2{font-size:24px;font-weight:700;margin-bottom:26px}
.paycard{display:flex;justify-content:space-between;align-items:center;background:var(--soft);border-radius:18px;padding:16px 18px;margin-bottom:12px}
.paycard b{display:block}
.paycard small{color:var(--muted)}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.stat{background:var(--soft);border-radius:18px;padding:18px 18px 16px}
.stat small{display:block;font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.stat b{font-family:var(--display);font-size:30px;font-weight:800;letter-spacing:-.02em}
.stat.hl{background:var(--green);color:#fff}
.stat.hl small{color:#fff;opacity:.85}
.full{grid-column:1/-1}
.recent-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.recent-head h2{margin:0!important}
.save-row{display:flex;justify-content:flex-end;margin-top:34px}
.pay-form{background:var(--soft);border-radius:22px;padding:20px;margin-top:14px}
.pay-form .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.prow{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px;margin-bottom:10px;align-items:center}
.prow .field{padding:12px 16px}

/* Auth */
.auth{display:grid;grid-template-columns:1fr 1fr;min-height:calc(100vh - 84px)}
.auth-form{display:flex;align-items:center;justify-content:center;padding:72px 28px}
.auth-inner{width:100%;max-width:470px}
.auth-inner .logo{display:inline-block;margin-bottom:56px;font-size:25px}
.auth-inner .page-title{font-size:clamp(40px,4.4vw,56px)}
.auth-inner .lede{font-size:18px;margin-bottom:40px}
.auth-meta{display:flex;justify-content:space-between;align-items:center;margin:-4px 0 22px;font-size:14px}
.auth-meta label{display:flex;gap:9px;align-items:center;color:var(--muted);cursor:pointer}
.auth-meta input{width:18px;height:18px;accent-color:var(--green)}
.auth-alt{text-align:center;margin-top:26px;color:var(--muted)}
.demo{margin-top:22px;text-align:center;font-size:13.5px;color:var(--muted)}
.auth-art{position:relative;overflow:hidden;background:linear-gradient(160deg,#D2B88E 0%,#E9D3A9 55%,#EDD6AA 100%);display:flex;flex-direction:column;justify-content:flex-end;min-height:560px}
.auth-art .crate{position:absolute;left:6%;right:6%;top:18%;bottom:20%;display:grid;place-items:center}
.auth-art .crate svg{width:100%;height:100%}
.auth-art::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(52,26,8,.72) 0%,rgba(52,26,8,.25) 30%,transparent 55%);pointer-events:none}
.auth-quote{position:relative;z-index:1;padding:0 56px 52px;color:#fff}
.auth-quote .eyebrow{color:#fff;font-size:12px;opacity:.9}
.auth-quote blockquote{margin:0 0 20px;font-family:var(--display);font-weight:700;font-size:clamp(26px,2.6vw,38px);line-height:1.15;letter-spacing:-.02em}

/* Info */
.prose{max-width:68ch}
.prose h2{font-size:24px;margin:34px 0 10px}
.prose p{color:var(--muted)}

/* Footer */
.site-foot{background:var(--footer);color:var(--footer-ink);padding:72px 0 44px}
.foot-top{display:grid;grid-template-columns:1.4fr repeat(3,auto);gap:56px;padding-bottom:62px;border-bottom:1px solid rgba(255,255,255,.12)}
.site-foot .logo{color:#fff;font-size:26px}
.site-foot p{color:var(--footer-muted);max-width:44ch;margin:16px 0 0}
.foot-col h4{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--footer-muted);margin:6px 0 16px}
.foot-col a{display:block;color:var(--footer-ink);text-decoration:none;margin-bottom:10px}
.foot-col a:hover{text-decoration:underline}
.foot-bot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-top:26px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--footer-muted)}

/* Toast & modal */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:13px 22px;border-radius:999px;font-weight:600;font-size:15px;opacity:0;pointer-events:none;transition:all .25s ease;z-index:100;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--danger);color:#fff}
.modal{position:fixed;inset:0;z-index:90;background:rgba(30,14,4,.55);display:none;align-items:center;justify-content:center;padding:24px;padding-top:calc(24px + env(safe-area-inset-top,0px))}
.modal.open{display:flex}
.dialog{background:var(--surface);border-radius:30px;max-width:780px;width:100%;max-height:calc(100% - 20px);overflow:auto;position:relative}
.dialog .farm-img{aspect-ratio:16/7}
.dialog-body{padding:34px 38px 38px}
.dialog-body h2{font-size:34px;font-weight:800}
.close{position:absolute;top:14px;right:14px;z-index:2;background:#FCF8EF;color:#2E1508;border:0;border-radius:999px;width:40px;height:40px;font-size:22px;cursor:pointer}
.story-meta{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 20px}
.chip{background:var(--soft);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600}
.story p{margin:0 0 14px}


/* Field story popup */
.dialog.story{background:var(--bg);max-width:760px}
.st-hero{position:relative;height:310px;overflow:hidden}
.st-hero svg{width:100%;height:100%;display:block}
.st-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(52,22,8,.94) 0%,rgba(52,22,8,.55) 45%,rgba(52,22,8,.05) 80%)}
.st-hero-txt{position:absolute;left:0;right:0;bottom:0;z-index:1;padding:0 32px 30px;color:#fff}
.st-kicker{margin:0 0 6px;color:var(--amber);font-size:12.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.st-hero h2{font-size:clamp(32px,5vw,46px);font-weight:800;letter-spacing:-.035em;line-height:1.05;color:#fff}
.st-by{margin:10px 0 0;font-style:italic;font-size:17px;opacity:.92}
.st-body{padding:40px 32px 36px}
.st-quote{margin:0 0 40px;border-left:4px solid var(--green);padding:6px 0 6px 26px}
.st-quote p{margin:0 0 16px;font-family:var(--display);font-weight:500;font-size:clamp(21px,2.6vw,25px);line-height:1.3;letter-spacing:-.01em}
.st-quote footer{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.st-harvest{padding:26px 24px 12px;margin-bottom:48px}
.st-harvest .eyebrow{font-size:12px;margin-bottom:4px}
.st-harvest h3{font-size:23px;font-weight:700;margin-bottom:12px}
.st-chapters{display:grid;gap:34px;margin-bottom:48px}
.st-ch{display:grid;grid-template-columns:72px 1fr;gap:0}
.st-n{font-family:var(--display);font-weight:800;font-size:28px;color:var(--green);line-height:1.2}
.st-ch h3{font-size:24px;font-weight:700;margin-bottom:8px}
.st-ch p{margin:0;color:var(--muted);font-size:16.5px;line-height:1.65}
.st-label{font-size:12px;margin-bottom:18px}
.st-time{list-style:none;margin:0 0 44px;padding:0}
.st-time li{position:relative;padding:0 0 22px 26px;border-left:2px solid var(--line);margin-left:3px}
.st-time li:last-child{padding-bottom:4px}
.st-time li::before{content:"";position:absolute;left:-8px;top:3px;width:14px;height:14px;border-radius:50%;background:var(--green)}
.st-time b{display:block;font-family:var(--display);font-size:19px;font-weight:700;line-height:1.1;margin-bottom:6px}
.st-time span{color:var(--muted);font-size:15px}
.st-prac{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:34px}
.st-prac span{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;font-weight:600;font-size:15px}
.st-yield{background:var(--green);color:#fff;border-radius:26px;padding:26px 24px}
.st-yield p{margin:0 0 4px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.st-yield b{display:block;font-family:var(--display);font-size:26px;font-weight:700;margin-bottom:4px}
.st-yield span{font-size:15px;opacity:.9}
@media (max-width:640px){.st-hero{height:260px}.st-hero-txt,.st-body{padding-left:22px;padding-right:22px}.st-ch{grid-template-columns:52px 1fr}.st-prac{grid-template-columns:1fr}}


/* Photos */
.farm-img img,.st-hero img{width:100%;height:100%;object-fit:cover;display:block}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.auth-art .crate{inset:0!important}
.auth-art .crate img{width:100%;height:100%;object-fit:cover;object-position:center 60%}

@media (max-width:1000px){
  .farm-grid{grid-template-columns:repeat(2,1fr)}
  .hero{grid-template-columns:1fr;padding-top:44px}
  .tiles{min-height:260px;max-width:560px}
  .cart-grid{grid-template-columns:1fr}
  .foot-top{grid-template-columns:1fr 1fr 1fr}
  .foot-top>div:first-child{grid-column:1/-1}
}
@media (max-width:860px){
  .site-head .wrap{grid-template-columns:1fr auto;height:72px}
  .nav-links{display:none;position:absolute;top:100%;left:0;right:0;background:var(--bg);flex-direction:column;align-items:stretch;gap:0;padding:8px 28px 18px;border-bottom:1px solid var(--line)}
  .nav-links.open{display:flex}
  .nav-links a,.nav-links button{padding:13px 0;text-align:left;border-bottom:1px solid var(--line)}
  .menu-btn{display:inline-block}
  .head-cta .btn{padding:11px 18px;font-size:14px}
  .auth{grid-template-columns:1fr;min-height:0}
  .auth-art{min-height:440px}
  .auth-quote{padding:0 28px 34px}
  .p-grid{grid-template-columns:1fr}
  .stats .grid{grid-template-columns:1fr;gap:40px}
}
@media (max-width:640px){
  .wrap{padding:0 20px}
  .farm-grid{grid-template-columns:1fr}
  .hero-form,.filter form{flex-direction:column}
  .pad,.order,.group{padding:24px}
  .line{grid-template-columns:1fr auto;row-gap:8px}
  .line .tot{text-align:left}
  .o-items{columns:1}
  .prow{grid-template-columns:1fr 1fr}
  .prow .field:first-child{grid-column:1/-1}
  .section-head{flex-direction:column;align-items:flex-start}
  .dialog-body{padding:26px}
  .foot-top{grid-template-columns:1fr 1fr}
  .slider-row{flex-wrap:wrap}
  .slider-row input{flex-basis:100%;order:3}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

      </div>

</footer>

<div class="modal" id="modal" aria-hidden="true"><div class="dialog" role="dialog" aria-modal="true" id="dialog"></div></div>

<script>
/* ---------- Helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '$' + (Math.round(n * 100) / 100).toFixed(2);
const fmt = n => Math.round(n).toLocaleString('en-US');
function hash(str){ let h = 5381; for (const c of String(str)) h = ((h << 5) + h + c.charCodeAt(0)) >>> 0; return h.toString(36); }
function rng(seed){ let s = seed % 2147483647; if (s <= 0) s += 2147483646; return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; }
const emailOk = e => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
const zipOk = z => /^\d{5}$/.test(z);

/* ---------- Photos ---------- */
const IMG = {
  aerial: 'images/orchard-barn.jpg',
  farmer: 'images/farmer-portrait.jpg',
  carrots: 'images/carrots-hands.jpg',
  eggs: 'images/crate-eggs.jpg',
  tomatoes: 'images/crate-tomatoes.jpg',
  greens: 'images/crate-greens.jpg'
};
const ALT = {"aerial": "Aerial view of an orchard with a red barn", "farmer": "Smiling farmer in a straw hat in a vegetable field", "carrots": "Hands holding freshly pulled rainbow carrots", "eggs": "Wooden crate of brown eggs", "tomatoes": "Wooden crate of vine tomatoes", "greens": "Wooden crate of leafy greens"};
const photo = k => `<img src="${IMG[k]}" alt="${ALT[k]}" loading="lazy" decoding="async">`;

/* ---------- Art (inline SVG) ---------- */
const svg = (inner, label) => `<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(label)}">${inner}</svg>`;

function artAerial(){
  const r = rng(7); let t = '';
  for (let y = -10; y < 312; y += 17) for (let x = -10; x < 412; x += 17){
    const cx = x + r()*8, cy = y + r()*8, dx = (cx-200)/96, dy = (cy-150)/72;
    if (dx*dx + dy*dy < 1) continue;
    const g = ['#6f9a2e','#86ad35','#a2bf3f','#5a8629'][Math.floor(r()*4)];
    t += `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${(6.5+r()*3).toFixed(1)}" fill="${g}"/>`;
  }
  return svg(`<rect width="400" height="300" fill="#3d6621"/>${t}<ellipse cx="200" cy="150" rx="92" ry="68" fill="#6f9c3b"/><ellipse cx="206" cy="140" rx="42" ry="28" fill="#b9a276" opacity=".85"/><path d="M196 310 C186 258 146 232 162 192 S236 158 212 128" stroke="#c9b48a" stroke-width="9" fill="none" stroke-linecap="round"/><g transform="translate(204 134) rotate(-25)"><rect x="-21" y="-12" width="42" height="24" fill="#c8313a"/><rect x="-21" y="-12" width="42" height="11" fill="#e2535b"/><rect x="-21" y="11" width="42" height="3" fill="#6f1a1f"/></g>`, 'Aerial view of an orchard with a red barn');
}
function artWheat(){
  const r = rng(11); let rows = '', stalks = '';
  for (let i = 0; i < 12; i++){ const y = 158 + i*i*0.95 + i*6; rows += `<path d="M0 ${y} Q200 ${y-9} 400 ${y}" stroke="#c28f2c" stroke-width="${(1+i*.28).toFixed(1)}" fill="none" opacity=".55"/>`; }
  for (let i = 0; i < 70; i++){ const x = r()*400, y = 205 + r()*100; stalks += `<path d="M${x.toFixed(1)} ${y.toFixed(1)} l${((r()-.5)*7).toFixed(1)} -${(14+r()*12).toFixed(1)}" stroke="#a8721c" stroke-width="2.4" stroke-linecap="round"/>`; }
  return svg(`<defs><linearGradient id="wsky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F5D39C"/><stop offset="1" stop-color="#FAEDD2"/></linearGradient></defs><rect width="400" height="300" fill="url(#wsky)"/><circle cx="312" cy="68" r="30" fill="#FCE4A6"/><path d="M0 152 Q200 136 400 152 V300 H0z" fill="#E7B654"/>${rows}${stalks}<g transform="translate(92 102)"><rect x="0" y="22" width="74" height="44" fill="#FDF6E8"/><path d="M-7 24 L37 -4 L81 24z" fill="#8C3B20"/><rect x="53" y="-2" width="10" height="17" fill="#8C3B20"/><rect x="30" y="40" width="14" height="26" fill="#5A3218"/><rect x="8" y="32" width="13" height="10" fill="#F2C26A"/><rect x="53" y="32" width="13" height="10" fill="#F2C26A"/></g>`, 'Wheat field with a small bakery');
}
function artFarmer(){
  let rows = ''; for (let i = 0; i < 10; i++) rows += `<path d="M200 168 L${-250+i*100} 300" stroke="#3E6A2A" stroke-width="12" opacity=".5"/>`;
  return svg(`<defs><linearGradient id="fsky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6E2B8"/><stop offset="1" stop-color="#E4EDD2"/></linearGradient></defs><rect width="400" height="300" fill="url(#fsky)"/><rect y="158" width="400" height="142" fill="#5E8E3A"/>${rows}<rect x="286" y="124" width="84" height="40" fill="#6B4A3A"/><path d="M278 126 L328 100 L378 126z" fill="#4A3228"/><path d="M104 300 Q112 224 200 214 Q288 224 296 300z" fill="#4F6F8F"/><path d="M160 226 L150 300 M240 226 L250 300" stroke="#3A2A20" stroke-width="7"/><path d="M172 220 L200 258 L228 220" fill="none" stroke="#3A556F" stroke-width="4"/><rect x="183" y="182" width="34" height="42" rx="10" fill="#C98B62"/><ellipse cx="153" cy="150" rx="8" ry="12" fill="#C98B62"/><ellipse cx="247" cy="150" rx="8" ry="12" fill="#C98B62"/><ellipse cx="200" cy="148" rx="47" ry="55" fill="#D69B70"/><path d="M174 126 q9 -6 18 0 M208 126 q9 -6 18 0" stroke="#4A2C1C" stroke-width="3.5" fill="none" stroke-linecap="round"/><ellipse cx="183" cy="140" rx="4.5" ry="5.5" fill="#3B2418"/><ellipse cx="217" cy="140" rx="4.5" ry="5.5" fill="#3B2418"/><path d="M200 146 q5 10 -3 14" stroke="#B8764F" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M176 168 Q200 194 224 168 Q200 178 176 168z" fill="#FFF" stroke="#8A4A32" stroke-width="2.5"/><ellipse cx="200" cy="104" rx="94" ry="20" fill="#B07A4A"/><path d="M149 104 Q151 50 200 48 Q249 50 251 104z" fill="#C58C57"/><rect x="149" y="92" width="102" height="11" fill="#7A4E2C"/>`, 'Smiling farmer in a straw hat in a vegetable field');
}
function artCarrots(){
  const r = rng(5); let soil = '', c = '';
  for (let i = 0; i < 190; i++) soil += `<circle cx="${(r()*400).toFixed(1)}" cy="${(r()*300).toFixed(1)}" r="${(1+r()*3.5).toFixed(1)}" fill="${['#4A2E1C','#5E3B24','#3A2416','#7A5234'][Math.floor(r()*4)]}"/>`;
  const cols = ['#E8742A','#D9482E','#F0A43A','#E05A2C','#C93A2A'];
  for (let i = 0; i < 5; i++){
    const tops = [...Array(7)].map((_, k) => `<path d="M0 44 Q${(k-3)*10} 6 ${(k-3)*17} ${-24-(k%2)*14}" stroke="${k%2?'#4F8A2A':'#62A034'}" stroke-width="3.2" fill="none" stroke-linecap="round"/>`).join('');
    c += `<g transform="translate(${118+i*41} 64) rotate(${(i-2)*7})">${tops}<path d="M-15 44 Q0 34 15 44 L3.5 206 Q0 214 -3.5 206z" fill="${cols[i]}"/><path d="M-9 80 h9 M-6 120 h8 M-4 160 h6" stroke="rgba(0,0,0,.2)" stroke-width="2"/></g>`;
  }
  return svg(`<rect width="400" height="300" fill="#6B4428"/>${soil}${c}`, 'Freshly pulled rainbow carrots on dark soil');
}
function cow(x, y, s){
  return `<g transform="translate(${x} ${y}) scale(${s})">${[-22,-12,14,24].map(l => `<rect x="${l}" y="4" width="5" height="21" fill="#3B2A22"/>`).join('')}<ellipse rx="32" ry="17" fill="#F7F3EA"/><ellipse cx="-8" cy="-4" rx="9" ry="7" fill="#2B221C"/><ellipse cx="14" cy="5" rx="7" ry="5" fill="#2B221C"/><ellipse cx="36" cy="-8" rx="11" ry="9" fill="#F7F3EA"/><ellipse cx="43" cy="-4" rx="6" ry="4" fill="#E8B4A8"/></g>`;
}
function artPasture(){
  return svg(`<defs><linearGradient id="psky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#CFE3EA"/><stop offset="1" stop-color="#F3EAD2"/></linearGradient></defs><rect width="400" height="300" fill="url(#psky)"/><path d="M0 150 Q100 110 210 140 T400 125 V300 H0z" fill="#7FAA4F"/><path d="M0 190 Q140 160 260 185 T400 175 V300 H0z" fill="#5F9440"/><g transform="translate(285 92)"><rect x="0" y="22" width="64" height="44" fill="#A8322C"/><path d="M-6 24 L32 -2 L70 24z" fill="#5B2320"/><rect x="24" y="40" width="16" height="26" fill="#F4EAD8"/></g>${cow(90,212,1)}${cow(205,232,1.2)}${cow(322,208,.85)}${[...Array(9)].map((_, i) => `<rect x="${i*50+10}" y="252" width="5" height="48" fill="#7A5A38"/>`).join('')}<path d="M0 264 H400 M0 282 H400" stroke="#8A6A44" stroke-width="3"/>`, 'Grass pasture with dairy cows and a red barn');
}
function artCrate(type, bg){
  const P = (u, v) => [200 + u*130 - v*130, 70 + u*58 + v*58];
  const D = 72, pts = a => a.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' '), dn = p => [p[0], p[1] + D];
  const A = P(0,0), B = P(1,0), C = P(1,1), E = P(0,1);
  const r = rng(type.length * 97 + 3), n = type === 'eggs' ? 3 : 4, items = [];
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++){ const p = P((i+.5)/n + (r()-.5)*.05, (j+.5)/n + (r()-.5)*.05); items.push(p); }
  items.sort((a, b) => a[1] - b[1]);
  let c = '';
  if (type === 'tomatoes'){
    c = items.map(([x, y]) => { const rr = 25 + r()*4; return `<g transform="translate(${x.toFixed(1)} ${(y-16).toFixed(1)})"><circle r="${rr.toFixed(1)}" fill="url(#tom)"/><ellipse cx="-9" cy="-10" rx="8" ry="5" fill="#fff" opacity=".35"/><g transform="translate(0 ${(-rr+7).toFixed(1)})">${[0,72,144,216,288].map(a => `<ellipse rx="3" ry="8" cy="-5" transform="rotate(${a})" fill="#3F7A2C"/>`).join('')}</g></g>`; }).join('');
    const a = P(.05,.25), b = P(.4,.35), d = P(.6,.75), e = P(.95,.8);
    c += `<path d="M${a[0]} ${a[1]-42} C${b[0]} ${b[1]-72} ${d[0]} ${d[1]-34} ${e[0]} ${e[1]-44}" stroke="#4D7A2E" stroke-width="5" fill="none" stroke-linecap="round"/>`;
  } else if (type === 'greens'){
    c = items.map(([x, y]) => `<g transform="translate(${x.toFixed(1)} ${(y-18).toFixed(1)})">${[-45,0,45,90].map((a, k) => `<ellipse rx="17" ry="30" cy="-12" transform="rotate(${a + (r()-.5)*20})" fill="${['#3E8A3A','#57A348','#2F7030','#4B9A40'][k]}"/>`).join('')}<path d="M0 0 v-34" stroke="#A9D38A" stroke-width="2"/></g>`).join('');
  } else {
    c = items.map(([x, y]) => `<ellipse cx="${x.toFixed(1)}" cy="${(y-12).toFixed(1)}" rx="22" ry="27" transform="rotate(${((r()-.5)*40).toFixed(0)} ${x.toFixed(1)} ${(y-12).toFixed(1)})" fill="url(#egg)"/>`).join('');
  }
  const L = [E, C, dn(C), dn(E)], R = [C, B, dn(B), dn(C)];
  const slat = (p1, p2, k) => { const o1 = [p1[0], p1[1] + D*k], o2 = [p2[0], p2[1] + D*k]; return `<line x1="${o1[0]}" y1="${o1[1]}" x2="${o2[0]}" y2="${o2[1]}" stroke="rgba(60,30,10,.45)" stroke-width="${k===.5?6:1.5}"/>`; };
  return svg(`${bg ? `<rect width="400" height="300" fill="${bg}"/>` : ''}<defs><radialGradient id="tom" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#EE5A3F"/><stop offset="1" stop-color="#A51D17"/></radialGradient><radialGradient id="egg" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#F6CD99"/><stop offset="1" stop-color="#CF8446"/></radialGradient></defs><ellipse cx="200" cy="262" rx="150" ry="24" fill="rgba(60,30,5,.18)"/><polygon points="${pts([A,B,C,E])}" fill="#6B3F25"/><polyline points="${pts([E,A,B])}" fill="none" stroke="#B98058" stroke-width="7" stroke-linejoin="round"/>${c}<polygon points="${pts(L)}" fill="#B97C4D"/><polygon points="${pts(R)}" fill="#9A6038"/>${slat(E,C,.5)}${slat(C,B,.5)}${slat(E,C,.25)}${slat(C,B,.25)}${slat(E,C,.78)}${slat(C,B,.78)}<polyline points="${pts([E,C,B])}" fill="none" stroke="#E0B184" stroke-width="7" stroke-linejoin="round"/>`, 'Wooden crate of ' + type);
}
function art(name){
  return IMG[name] ? photo(name) : photo('greens');
}

/* ---------- Data ---------- */
const FARMS = [
  {id:'marrow', name:'Marrow & Seed', loc:'Brooklyn, NY', desc:'Hyper-local community garden network.', yield:'Seasonal', base:4.2, art:'aerial', farmer:'Tomas Reyes', since:2016, practices:['No-till beds','Rooftop compost','14 shared plots'],
   story:['Marrow & Seed started as a single vacant lot on Dean Street. Today Tomas Reyes coordinates fourteen community plots across Brooklyn, each tended by neighbors who split the harvest and sell the surplus here.','Greens are cut the morning of your delivery and never touch a warehouse. Every sale pays the growers directly and funds seed for next season.'],
   products:[{id:'arugula',name:'Baby Arugula',price:6,unit:'6 oz'},{id:'shiso',name:'Shiso Leaves',price:5.5,unit:'bunch'},{id:'micro',name:"Chef's Microgreens",price:9,unit:'4 oz'}]},
  {id:'wildkiln', name:'Wildkiln Bakery Farm', loc:'Queens, NY', desc:'Grain-to-loaf sourdough with a rooftop wheat plot.', yield:'High', base:9.7, art:'aerial', farmer:'Priya Anand', since:2019, practices:['Stone-milled flour','48-hour ferment','Rooftop heritage wheat'],
   story:['Priya Anand grows heritage wheat on a warehouse roof in Long Island City, then mills it by stone a floor below. What the roof can’t supply comes from two partner growers upstate.','Loaves are baked overnight and loaded straight onto the morning freight run, so they reach you the day they come out of the oven.'],
   products:[{id:'sourdough',name:'Country Sourdough Loaf',price:11,unit:'loaf'},{id:'rye',name:'Seeded Rye',price:12.5,unit:'loaf'}]},
  {id:'oakridge', name:'Oak Ridge Collective', loc:'Hudson Valley, NY', desc:'Third-generation sustainable vegetable patch.', yield:'High', base:12, art:'farmer', farmer:'Eli Hollis', since:1961, practices:['Cover cropping','Crop rotation','Family run since 1961'],
   story:['The Hollis family has worked the same forty acres since 1961. Eli, the youngest, moved the farm off wholesale contracts in 2022 so the family could set its own prices.','Roots and brassicas come out of the ground on Monday and Thursday, the two days the Jiksong freight van passes through.'],

let memStore = null;
function seed(){

    session: null, remember: true, cart: [], orders: {}, zip: ''
  };
}
function load(){ try { const raw = localStorage.getItem(KEY); if (raw) return JSON.parse(raw); } catch(e){} return memStore; }
let S = load() || seed();
function save(){ memStore = S; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
try { if (S.session && !S.remember && !sessionStorage.getItem('jk-live')) { S.session = null; save(); } } catch(e){}

const me = () => (S.session && S.users[S.session]) || null;
const cartCount = () => S.cart.reduce((a, c) => a + c.qty, 0);
function cityFor(zip){
  if (zip === '11217') return 'Brooklyn, NY';
  const p = zip.slice(0, 3);
  if (['100','101','102'].includes(p)) return 'New York, NY';
  if (['112'].includes(p)) return 'Brooklyn, NY';
  if (['113','114','116'].includes(p)) return 'Queens, NY';
  if (['104'].includes(p)) return 'Bronx, NY';
  return 'ZIP ' + zip;
}
function activeZip(){ return S.zip || me()?.zip || '11217'; }
function allFarms(){
  const extra = [];
  for (const u of Object.values(S.users)){
    if (u.farm && u.farm.published && u.farm.products.length){
      extra.push({...u.farm, id:'u-' + hash(u.email), owner:u.email, base:6, art:'greens', farmer:u.name, since:new Date().getFullYear(), mine: S.session === u.email,
        practices:['New on Jiksong'], story:[u.farm.desc || 'A new family farm on Jiksong.']});
    }
  }
  return FARMS.concat(extra);
}
function distFor(f){
  const z = activeZip();
  if (z === '11217') return f.base;
  let h = 0; for (const c of z) h = (h * 31 + c.charCodeAt(0)) % 9973;
  const factor = 0.6 + ((h + Math.round(f.base * 100)) % 120) / 100;
  return Math.round(f.base * factor * 10) / 10;
}
const sortedFarms = () => allFarms().map(f => ({...f, dist: distFor(f)})).sort((a, b) => a.dist - b.dist);
const findFarm = id => allFarms().find(f => f.id === id);

/* ---------- Cart ---------- */
function cartLines(){
  return S.cart.map(c => { const f = findFarm(c.farm); const p = f && f.products.find(x => x.id === c.prod); return f && p ? {farm:f, prod:p, qty:c.qty} : null; }).filter(Boolean);
}
function calc(lines){
  const subtotal = lines.reduce((a, l) => a + l.prod.price * l.qty, 0);
  const farms = [...new Map(lines.map(l => [l.farm.id, l.farm])).values()];
  const freight = farms.reduce((a, f) => a + 1.5 + 0.12 * distFor(f), 0);
  const avg = farms.length ? farms.reduce((a, f) => a + distFor(f), 0) / farms.length : 0;
  return {subtotal, freight: Math.round(freight * 100) / 100, total: subtotal + Math.round(freight * 100) / 100, producers: farms.length, farms, miles: farms.length ? Math.round(1500 - avg) : 0, items: lines.reduce((a, l) => a + l.qty, 0)};
}
function addToCart(farmId, prodId, qty = 1, quiet = false){
  const f = findFarm(farmId); if (!f) return false;
  const p = f.products.find(x => x.id === prodId); if (!p) return false;
  const producers = new Set(S.cart.map(c => c.farm));
  if (!producers.has(farmId) && producers.size >= 5){ if (!quiet) toast(`Your box holds 5 producers. Remove one to add ${f.name}.`, true); return false; }
  const ex = S.cart.find(c => c.farm === farmId && c.prod === prodId);
  if (ex) ex.qty += qty; else S.cart.push({farm: farmId, prod: prodId, qty});
  save(); renderNav();
  if (!quiet) toast(`Added ${p.name} to your box.`);
  return true;
}

    `<button class="menu-btn" data-action="menu" aria-expanded="false" aria-controls="nav">Menu</button>`;
}

function render(keepScroll){
  const {path, q} = parse();
  const views = {'/': viewHome, '/impact': viewHome, '/farms': viewFarms, '/cart': viewCart, '/orders': viewOrders, '/profile': viewProfile, '/login': viewLogin, '/signup': viewSignup};
  if (path === '/profile' && !me()){ toast('Log in to see your profile.'); go('/login?next=/profile'); return; }
  const v = views[path] || (INFO[path.slice(1)] ? () => viewInfo(path.slice(1)) : viewNotFound);

  document.title = 'JIKSONG — ' + ({'/farms':'Farms','/cart':'Cart','/orders':'Orders','/profile':'Profile','/login':'Log in','/signup':'Join'}[path] || 'From Dirt to Door');
}

/* ---------- Actions ---------- */
function luhn(n){ let s = 0, alt = false; for (let i = n.length - 1; i >= 0; i--){ let d = +n[i]; if (alt){ d *= 2; if (d > 9) d -= 9; } s += d; alt = !alt; } return s % 10 === 0; }
function readFarmDraft(){
  const form = $('[data-form="farm"]'); if (!form || !UI.farmDraft) return;
  ['name','loc','desc','yield'].forEach(k => UI.farmDraft[k] = form.elements[k].value.trim());
  UI.farmDraft.products = [...form.querySelectorAll('.prow')].map((row, i) => ({id: UI.farmDraft.products[i]?.id || 'p' + Date.now() + i, name: row.querySelector('[data-k=name]').value.trim(), price: row.querySelector('[data-k=price]').value.trim(), unit: row.querySelector('[data-k=unit]').value.trim()}));
}
const ACTIONS = {
  menu(el){ const n = $('#nav'); n.classList.toggle('open'); el.setAttribute('aria-expanded', n.classList.contains('open')); },
  close: closeModal,
  logout(){ S.session = null; save(); UI.farmDraft = null; toast('Logged out.'); const {path} = parse(); if (path === '/profile') go('/'); else render(true); },
  add(el){ if (addToCart(el.dataset.farm, el.dataset.prod) && parse().path === '/cart') render(true); },
  more(el){ UI.expanded[el.dataset.farm] = !UI.expanded[el.dataset.farm]; $('#farmGrid').innerHTML = farmGrid().grid; },
  widen(){ UI.radius = 100; render(true); },
  story(el){ const f = findFarm(el.dataset.farm); if (f){ openModal(storyHTML(f)); $('#dialog').classList.add('story'); } },
  qty(el){ const c = S.cart.find(x => x.farm === el.dataset.farm && x.prod === el.dataset.prod); if (!c) return; c.qty += +el.dataset.d; if (c.qty <= 0) S.cart = S.cart.filter(x => x !== c); save(); render(true); },
  remove(el){ S.cart = S.cart.filter(x => !(x.farm === el.dataset.farm && x.prod === el.dataset.prod)); save(); render(true); },
  checkout(){
    const lines = cartLines(); if (!lines.length) return;
    if (!me()){ toast('Log in to place your order.'); go('/login?next=/cart'); return; }
    const t = calc(lines);
    const o = {id: 'JK-' + Math.random().toString(36).slice(2, 7).toUpperCase(), ts: Date.now(), items: lines.map(l => ({farm: l.farm.id, farmName: l.farm.name, prod: l.prod.id, name: l.prod.name, price: l.prod.price, unit: l.prod.unit, qty: l.qty})), subtotal: t.subtotal, freight: t.freight, total: t.total, producers: t.producers, miles: t.miles};
    (S.orders[S.session] ||= []).unshift(o); S.cart = []; save();
    toast(`Order ${o.id} placed. ${money(t.subtotal)} goes straight to your farmers.`); go('/orders');
  },
  cancel(el){ const o = myOrders().find(x => x.id === el.dataset.id); if (o && stepOf(o) === 0){ o.cancelled = true; save(); toast(`Order ${o.id} cancelled.`); render(true); } else toast('This order is already being packed.', true); },
  reorder(el){ const o = myOrders().find(x => x.id === el.dataset.id); if (!o) return; let added = 0, skipped = 0; for (const i of o.items){ if (addToCart(i.farm, i.prod, i.qty, true)) added++; else skipped++; } toast(skipped ? `Added ${added} item${added === 1 ? '' : 's'}. ${skipped} couldn’t be added.` : 'Items added to your box.', !!skipped && !added); go('/cart'); },
  mode(el){ const u = me(); u.mode = el.dataset.mode; save(); UI.farmDraft = null; render(true); },
  paytoggle(){ UI.showPay = !UI.showPay; render(true); if (UI.showPay) $('#pc-num')?.focus(); },
  savecard(){
    const num = $('#pc-num').value.replace(/\D/g, ''), exp = $('#pc-exp').value.trim(), cvc = $('#pc-cvc').value.trim(), err = $('#payErr');
    if (num.length < 13 || num.length > 19 || !luhn(num)) return err.textContent = 'Check the card number. It should be 13–19 digits.';
    const m = exp.match(/^(0[1-9]|1[0-2])\/(\d{2})$/); if (!m) return err.textContent = 'Enter the expiry as MM/YY.';
    const now = new Date(), yy = now.getFullYear() % 100; if (+m[2] < yy || (+m[2] === yy && +m[1] < now.getMonth() + 1)) return err.textContent = 'This card has expired.';
    if (!/^\d{3,4}$/.test(cvc)) return err.textContent = 'Enter the 3 or 4 digit CVC.';
    const brand = num[0] === '4' ? 'Visa' : num[0] === '5' || num[0] === '2' ? 'Mastercard' : num[0] === '3' ? 'Amex' : 'Card';
    me().cards.push({brand, last4: num.slice(-4), exp}); save(); UI.showPay = false; toast(`${brand} ending ${num.slice(-4)} saved.`); render(true);
  },
  rmcard(el){ const u = me(); const c = u.cards.splice(+el.dataset.i, 1)[0]; save(); toast(`${c.brand} ending ${c.last4} removed.`); render(true); },
  addprod(){ readFarmDraft(); UI.farmDraft.products.push({id: 'p' + Date.now(), name: '', price: '', unit: ''}); render(true); },
  rmprod(el){ readFarmDraft(); UI.farmDraft.products = UI.farmDraft.products.filter(p => p.id !== el.dataset.id); if (!UI.farmDraft.products.length) UI.farmDraft.products.push({id: 'p' + Date.now(), name: '', price: '', unit: ''}); render(true); },
  unpublish(){ const u = me(); if (u.farm){ u.farm.published = false; save(); UI.farmDraft = null; S.cart = S.cart.filter(c => c.farm !== 'u-' + hash(u.email)); save(); toast('Listing unpublished.'); render(true); } },
  demo(){ $('#li-email').value = 'ada@example.com'; $('#li-pw').value = 'harvest123'; },
  forgot(){
    openModal(`<div class="dialog-body"><p class="eyebrow">Reset password</p><h2 style="font-size:30px;margin-bottom:10px">Forgot your password?</h2><p class="muted">Enter your account email and we’ll send a reset link.</p><form data-form="forgot" novalidate><div class="fgroup"><input class="field" name="email" type="email" placeholder="you@example.com" aria-label="Email address" value="${esc($('#li-email')?.value || '')}"><p class="err" id="fgErr"></p></div><button class="btn btn-green" type="submit">Send reset link</button></form></div>`);
  }
};
document.addEventListener('click', e => { const a = e.target.closest('[data-action]'); if (!a) return; e.preventDefault(); ACTIONS[a.dataset.action]?.(a, e); });
document.addEventListener('input', e => {
  if (e.target.dataset.input === 'radius'){ UI.radius = +e.target.value; $('#radLabel').textContent = `Within ${UI.radius} mi`; const g = farmGrid(); $('#matchCount').textContent = g.count; $('#farmGrid').innerHTML = g.grid; }

const FORMS = {
  'zip-home'(f){ const z = f.elements.zip.value.trim(); if (z && !zipOk(z)) return toast('Enter a 5-digit zip code.', true); S.zip = z; save(); go('/farms'); },
  'zip-farms'(f){ const z = f.elements.zip.value.trim(); if (z && !zipOk(z)) return toast('Enter a 5-digit zip code.', true); S.zip = z; save(); toast(z ? `Routing from ${z}.` : 'Routing from your saved zip.'); render(true); },
  login(f){
    const email = f.elements.email.value.trim().toLowerCase(), pw = f.elements.pw.value, u = S.users[email], box = $('#loginErr');
    if (!email || !pw){ box.innerHTML = '<div class="form-err">Enter your email and password.</div>'; return; }
    if (!u || u.pw !== hash(pw)){ box.innerHTML = '<div class="form-err">That email and password don’t match an account. Check both, or reset your password.</div>'; return; }
    S.session = email; S.remember = f.elements.remember.checked; try { sessionStorage.setItem('jk-live', '1'); } catch(e){}
    if (f.dataset.farmer) u.mode = 'farmer';
    save(); toast(`Welcome back, ${u.name.split(' ')[0]}.`);
    go(f.dataset.farmer ? '/profile' : (f.dataset.next || '/farms'));
  },
  signup(f){
    const v = k => f.elements[k].value.trim(); const errs = {};
    if (!v('name')) errs.name = 'Enter your full name.';
    if (!emailOk(v('email'))) errs.email = 'Enter a valid email address.'; else if (S.users[v('email').toLowerCase()]) errs.email = 'An account with this email already exists. Log in instead.';
    if (f.elements.pw.value.length < 8) errs.pw = 'Use at least 8 characters.';
    if (!zipOk(v('zip'))) errs.zip = 'Enter a 5-digit zip code.';
    f.querySelectorAll('[data-err]').forEach(p => p.textContent = errs[p.dataset.err] || '');
    if (Object.keys(errs).length) return f.elements[Object.keys(errs)[0]].focus();
    const email = v('email').toLowerCase();
    S.users[email] = {name: v('name'), email, pw: hash(f.elements.pw.value), zip: v('zip'), city: cityFor(v('zip')), phone: '', address: '', notes: '', since: new Date().getFullYear(), cards: [], mode: 'customer', farm: null};
    S.session = email; S.remember = true; S.zip = ''; save();
    toast(`Welcome to JIKSONG, ${v('name').split(' ')[0]}.`); go(f.dataset.next || '/farms');
  },
  profile(f){
    const u = me(), v = k => f.elements[k].value.trim();
    if (!v('name')) return toast('Name can’t be empty.', true);
    if (!emailOk(v('email'))) return toast('Enter a valid email address.', true);
    if (!zipOk(v('zip'))) return toast('Enter a 5-digit zip code.', true);
    const newEmail = v('email').toLowerCase();
    if (newEmail !== u.email){
      if (S.users[newEmail]) return toast('That email is already used by another account.', true);
      delete S.users[u.email]; if (S.orders[u.email]){ S.orders[newEmail] = S.orders[u.email]; delete S.orders[u.email]; }
      u.email = newEmail; S.users[newEmail] = u; S.session = newEmail;
    }
    Object.assign(u, {name: v('name'), phone: v('phone'), address: v('address'), notes: v('notes'), zip: v('zip'), city: cityFor(v('zip'))});
    save(); toast('Changes saved.'); render(true);
  },
  farm(){
    readFarmDraft(); const d = UI.farmDraft, err = $('#farmErr');
    if (!d.name || !d.loc) return err.textContent = 'Add a farm name and location.';
    const prods = d.products.filter(p => p.name || p.price || p.unit);
    for (const p of prods){ if (!p.name || !p.unit || !(parseFloat(p.price) > 0)) return err.textContent = 'Each product needs a name, a price above $0, and a unit.'; }
    if (!prods.length) return err.textContent = 'Add at least one product.';
    me().farm = {name: d.name, loc: d.loc, desc: d.desc, yield: d.yield, products: prods.map(p => ({id: p.id, name: p.name, price: Math.round(parseFloat(p.price) * 100) / 100, unit: p.unit})), published: true};
    save(); UI.farmDraft = null; toast(`${d.name} is live on the Farms page.`); render(true);
  },
  forgot(f){ const e = f.elements.email.value.trim(); if (!emailOk(e)) return $('#fgErr').textContent = 'Enter a valid email address.'; closeModal(); toast(`If an account exists for ${e}, a reset link is on its way.`); }
};
document.addEventListener('submit', e => { const f = e.target.closest('[data-form]'); if (!f) return; e.preventDefault(); FORMS[f.dataset.form]?.(f); });

/* Keep order statuses moving while the orders page is open */
setInterval(() => { const {path} = parse(); if ((path === '/orders' || path === '/profile') && myOrders().length && !document.activeElement?.matches('input,textarea,select')) render(true); }, 20000);

render(false);
</script>
</body>
</html>
